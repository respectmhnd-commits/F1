name: Start_Stream

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'يوزر قناة كيك'
        required: true
        default: 'OSAMAH'
        type: string
      stream_key:
        description: 'مفتاح البث (Stream Key)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink

      - name: Run Stream Script
        env:
          CHANNEL_NAME: ${{ inputs.channel_name }}
          STREAM_KEY: ${{ inputs.stream_key }}
        run: |
          python main.py
